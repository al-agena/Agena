# Gemini AI has the following hints about Dr. Memory, as of July 25, 2026:
#Running with uninitialized tracking active (no -no_check_uninitialized flag) is the only
#way to catch genuine structural leaks, but brace yourself—because you are running an
#unoptimized binary (-O0) under an outdated version of Dr. Memory on a modern Windows 11
#kernel, you are going to see a flood of new phantom reports.
#
#To help you preserve your sanity and avoid aging another ten years while scanning the results,
#use these three filtering rules to instantly separate the real bugs from the tool's false alarms:
#
#1. The "Whom to Blame" Rule (The most important)
#------------------------------------------------
#A Real Bug: Look for stack frames that list your own source code files right at the top (#0 or #1),
#such as agena.dll!your_function [your_file.c:line].
#
#A Phantom Bug: If the top frames (#0, #1, #2) are deep inside system DLLs like ntdll.dll!*,
#KERNELBASE.dll!*, or msvcrt.dll!*, ignore them immediately. Those are instances of Dr. Memory
#failing to track the internal Windows 11 register movements.
#
#2. The Lua Engine Padding Rule
#------------------------------
#If Dr. Memory flags an uninitialized read inside the core Lua engine files (lvm.c, ldo.c, lapi.c):
#
#Look closely at what it is reading. If it says reading 4 byte(s) or reading 8 byte(s) during a
#comparison or stack push, it is almost always reading the invisible memory alignment padding inside
#the TValue or Closure structs that Windows left dirty.
#
#Unless your interpreter is actively misbehaving or throwing random math calculations, these are
#harmless compiler-alignment artifacts.
#
#3. The Re-used Heap Pointer Rule
#--------------------------------
#If you suddenly see an explosion of UNINITIALIZED READ errors popping up during package conversions
#or loops that were working perfectly before, check if the memory pointer was allocated with calloc.
#If your code is using calloc (like your NumArray data arrays), it is physically impossible for that
#data to be uninitialized. Those are 100% phantom tracking errors caused by Dr. Memory losing track
#of recycled heap addresses.
