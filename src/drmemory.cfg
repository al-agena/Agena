# Agena Profiling
#
# Dr. Memory: `logs` must be an existing folder. From testall subfolder run:
# drmemory -no_check_uninitialized -logdir ./logs -suppress ..\src\drmemory.cfg -debug -brief -- ..\src\agena.exe
# The -no_check_uninitialized flag prevents Dr. Memory from showing up phantom bugs mostly, but it may hide flaws ...
# See bottom of this file on how to interpret (and ignore) the results.
#
# Linux perf: From testall subfolder run:
# perf record -g ../src/agena <a script>
# perf report
#
# Following are Dr. Memory suppressions:

